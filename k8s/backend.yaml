apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudvault-backend
  namespace: cloudvault2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudvault-backend
  template:
    metadata:
      labels:
        app: cloudvault-backend
    spec:
      containers:
        - name: backend
          image: codecurious06/cloudvault-backend:cloudvault2-v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudvault-db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_HOST
              value: cloudvault-db

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              value: cloudvault

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10